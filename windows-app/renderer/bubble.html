<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>咕咕龙气泡</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: flex-start; justify-content: center; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    .bubble {
      position: relative;
      width: calc(100% - 9px);
      height: 38px;
      margin-top: 3px;
      border: 2px solid #144f29;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 254, 232, .98), rgba(231, 255, 210, .98));
      box-shadow: 0 3px 8px rgba(13, 65, 31, .22), inset 0 1px 0 rgba(255, 255, 255, .75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px 0 25px;
    }
    .bubble::after {
      content: "";
      position: absolute;
      right: 10px;
      bottom: -9px;
      width: 19px;
      height: 15px;
      background: #eaffd3;
      border-right: 2px solid #144f29;
      border-bottom: 2px solid #144f29;
      transform: skewX(-30deg) rotate(16deg);
      border-radius: 0 0 5px 0;
    }
    .sparkle {
      position: absolute;
      left: 10px;
      top: 11px;
      color: #ffb72a;
      font-size: 14px;
      line-height: 1;
      text-shadow: 0 1px 0 #fff;
    }
    .text {
      color: #144f29;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .4px;
      white-space: nowrap;
      text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff;
    }
  </style>
</head>
<body>
  <div class="bubble" role="status" aria-label="咕咕龙说咕咕嘎嘎">
    <span class="sparkle">✦</span>
    <span class="text" id="text">咕咕嘎嘎</span>
  </div>
  <script>
    window.setBubbleText = (value) => {
      document.querySelector('#text').textContent = value || '咕咕嘎嘎';
    };
  </script>
</body>
</html>
